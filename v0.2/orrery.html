<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
  // Apply the saved theme before first paint.
  try { const t = localStorage.getItem('orrery.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ───────────────────────── Tokens ───────────────────────── */
:root {
  --bg: #EDF0F3;
  --surface: #F8F9FB;
  --surface-2: #E4E8ED;
  --ink: #1B2430;
  --muted: #5A6573;
  --rule: #C9D0D8;
  --rule-strong: #9AA5B2;
  --brass: #B08A3E;        /* rings, marks */
  --brass-text: #86651F;   /* brass used as text on light surfaces */
  --brass-wash: rgba(176, 138, 62, .14);
  --hover: rgba(27, 36, 48, .06);
  --danger: #A33A2E;
  --unassigned: #6B7480;
  --orbit: rgba(27, 36, 48, .07);
  --edge: #7F8B99;
  --shadow: 0 1px 2px rgba(27,36,48,.06), 0 8px 24px rgba(27,36,48,.08);
  --on-tile: #FFFFFF;
  --info: #2F7FB8;         /* "more on hover" dot */
  --warn: #E0A800;         /* warning triangles */
  --warn-edge: #9A7400;
  --tile-stroke: rgba(0,0,0,.18);

  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-eyebrow: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --radius: 12px;
  --fast: 150ms;
  --panel-t: 200ms;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1A2029; --surface-2: #232B36; --ink: #E6E9EE; --muted: #9AA4B1;
    --rule: #2E3744; --rule-strong: #4A5566; --brass: #D4AE62; --brass-text: #D4AE62;
    --brass-wash: rgba(212, 174, 98, .14); --hover: rgba(230, 233, 238, .07); --danger: #E0796B;
    --unassigned: #5D6673; --orbit: rgba(230, 233, 238, .06); --edge: #6C7888;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --tile-stroke: rgba(255,255,255,.14);
    --info: #6AB0E0; --warn: #F2C230; --warn-edge: #F2C230;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --surface: #1A2029; --surface-2: #232B36; --ink: #E6E9EE; --muted: #9AA4B1;
  --rule: #2E3744; --rule-strong: #4A5566; --brass: #D4AE62; --brass-text: #D4AE62;
  --brass-wash: rgba(212, 174, 98, .14); --hover: rgba(230, 233, 238, .07); --danger: #E0796B;
  --unassigned: #5D6673; --orbit: rgba(230, 233, 238, .06); --edge: #6C7888;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --tile-stroke: rgba(255,255,255,.14);
    --info: #6AB0E0; --warn: #F2C230; --warn-edge: #F2C230;
  color-scheme: dark;
}

/* ───────────────────────── Base ───────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.eyebrow { font: italic 400 17px/1.2 var(--font-eyebrow); color: var(--muted); letter-spacing: .01em; }
.mono { font-family: var(--font-mono); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ───────────────────────── Stage ───────────────────────── */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; user-select: none; }
#stage.panning { cursor: grabbing; }
.orbits circle { fill: none; stroke: var(--orbit); stroke-width: 1; vector-effect: non-scaling-stroke; }
.orbits { transition: opacity 300ms ease; }
.orbits.off { opacity: 0; }

.edges line { stroke: var(--edge); stroke-width: 1.4; transition: opacity var(--fast) ease, stroke var(--fast) ease; }
.edges line.lit { stroke: var(--ink); stroke-width: 1.8; }
.edges line.dim { opacity: .12; }

.card { cursor: pointer; }
.card .body { transition: opacity var(--fast) ease; }
.card .body.dim { opacity: .18; }
.card .shape { stroke-width: 1.5; }
.card.t-role .shape { stroke: var(--tile-stroke); stroke-width: 1; }
.card .kicon { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.headers text.note { fill: var(--muted); font: italic 400 24px var(--font-eyebrow); letter-spacing: 0; }
.card.t-role text { fill: var(--on-tile); font: 600 13px var(--font-ui); }
.card.t-process .shape { fill: var(--surface); stroke: var(--ink); }
.card.t-process text { fill: var(--ink); font: 500 14px var(--font-ui); }
.card.t-process.k-header text { font-size: 15px; font-weight: 600; }
.card.t-process text.desc { fill: var(--muted); font: 400 11.5px var(--font-ui); }
.card.t-meeting .shape, .card.t-document .shape { fill: var(--surface); stroke: var(--rule-strong); stroke-width: 1; }
.card.t-meeting text, .card.t-document text { fill: var(--ink); font: 500 12.5px var(--font-ui); }
.card.t-meeting.k-header text { font-size: 14px; font-weight: 600; }
.card.t-meeting.k-header .shape { stroke: var(--ink); stroke-width: 1.5; }
.card .kicon { color: var(--muted); }
.card.t-role .kicon { color: var(--on-tile); opacity: .85; }
.card .sub { fill: var(--muted) !important; font: 500 11px var(--font-mono) !important; letter-spacing: .02em; }
.card .chip rect { fill: var(--ink); }
.card .chip text { fill: var(--surface) !important; font: 500 9.5px var(--font-mono) !important; letter-spacing: .04em; }
.card .chip.outline rect { fill: none; stroke: currentColor; }
.card.t-role .chip rect { fill: rgba(255,255,255,.92); }
.card.t-role .chip text { fill: #1B2430 !important; }
.card.t-role .chip.outline rect { fill: none; stroke: rgba(255,255,255,.8); }
.card.t-role .chip.outline text { fill: #FFFFFF !important; }
.card:not(.t-role) .chip.outline { color: var(--ink); }
.card:not(.t-role) .chip.outline text { fill: var(--ink) !important; }
.card .badge circle { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.card .badge use { color: var(--surface); }
.card .pin circle { fill: var(--surface); stroke: var(--rule-strong); stroke-width: 1; }
.card .pin use { color: var(--muted); stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.card .ring { fill: none; stroke: var(--brass); stroke-width: 2.5; opacity: 0; transition: opacity var(--fast) ease; pointer-events: none; }
.card.selected .ring { opacity: 1; }
.card.link-target .ring { opacity: 1; stroke-dasharray: 4 3; }
.card.link-invalid { cursor: not-allowed; }
.card.collapsed .shape { stroke: var(--bg); stroke-width: 1.5; }
.headers rect { rx: 8px; }
.headers text { fill: #FFFFFF; font: 600 13px var(--font-ui); letter-spacing: .02em; }
.headers .unassigned { fill: var(--unassigned); }
/* Process flows: a line with its arrowhead at the midpoint; a two-way pair is two thin strands with half-arrows. */
.flows .flow > * { transition: opacity var(--fast) ease; }
.flows .strand { stroke: var(--ink); stroke-width: 2.5; fill: none; transition: stroke var(--fast) ease; }
.flows .flow.two .strand { stroke-width: 1.5; }
.flows .head { fill: var(--ink); stroke: none; transition: fill var(--fast) ease; }
.flows .hit { stroke: transparent; stroke-width: 12; fill: none; pointer-events: stroke; }
.flows .flow.two .hit { stroke-width: 10; }
.flows .flow.hover .strand { stroke: var(--brass); }
.flows .flow.hover.two .strand { stroke-width: 2; }
.flows .flow.hover .head { fill: var(--brass); }
.flows .flow.dim > * { opacity: .12; }   /* on the children: the group's own opacity is used for fading between views */
.card.flow-row .shape { stroke-dasharray: 5 3; stroke-width: 1.2; }
.rubber { stroke: var(--brass); stroke-width: 2; stroke-dasharray: 6 5; fill: none; pointer-events: none; vector-effect: non-scaling-stroke; }
.rubber.invalid { stroke: var(--danger); }
/* SVG elements ignore the HTML hidden attribute, so honour it explicitly. */
svg [hidden] { display: none; }

/* ───────────────────────── Panels ───────────────────────── */
.panel {
  position: fixed; z-index: 10;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform var(--panel-t) var(--ease-out), opacity var(--panel-t) var(--ease-out), visibility 0s linear 0s;
}
.panel.collapsed { opacity: 0; pointer-events: none; visibility: hidden; transition: transform var(--panel-t) var(--ease-out), opacity var(--panel-t) var(--ease-out), visibility 0s linear var(--panel-t); }
.orb {
  position: absolute; z-index: 11; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--ease-out), opacity var(--panel-t) ease, background var(--fast) ease;
}
.orb:hover { background: var(--brass-text); }
.orb:active { transform: scale(.94); }
.orb .ic { width: 18px; height: 18px; stroke-width: 2.25; }
.orb.small { width: 28px; height: 28px; }
.orb.small .ic { width: 16px; height: 16px; }
.orb[hidden] { display: none; }

.iconbtn {
  width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; position: relative;
  color: var(--ink); transition: background var(--fast) ease, color var(--fast) ease, transform var(--fast) var(--ease-out);
}
.iconbtn:hover { background: var(--hover); }
.iconbtn:active { transform: scale(.94); }
.iconbtn:disabled { color: var(--rule-strong); cursor: default; background: none; transform: none; }
.iconbtn[aria-pressed="true"] { background: var(--brass-wash); color: var(--brass-text); }
.iconbtn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 2px var(--surface); }

/* Toolbar (top left) */
#toolbar { top: 16px; left: 16px; padding: 6px; display: flex; align-items: center; gap: 2px; }
#toolbar.collapsed { transform: translateX(-12px); }
#toolbar .sep { width: 1px; height: 22px; background: var(--rule); margin: 0 5px; }
#toolbar-collapse { position: static; margin-left: 6px; }
#toolbar-open, #legend-open, #detail-open { position: fixed; }
#toolbar-open { top: 16px; left: 16px; }
#sub-toggle { position: absolute; left: 50%; bottom: -15px; margin-left: -14px; }
#sub-toggle .ic { transition: transform var(--panel-t) var(--ease-out); }
#sub-toggle[aria-expanded="true"] .ic { transform: rotate(180deg); }
#subpanel { top: 82px; left: 16px; width: 300px; padding: 14px 14px 12px; transform-origin: top left; }
#subpanel.collapsed { transform: translateY(-6px); }
#subpanel .title-row { margin-bottom: 10px; }
#subpanel .doc-title { font-weight: 600; font-size: 15px; width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; margin-left: -6px; }
#subpanel .doc-title:enabled:hover, #subpanel .doc-title:focus { border-color: var(--rule); background: var(--bg); outline: none; }
#subpanel .file-name { color: var(--muted); font: 500 11.5px var(--font-mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#subpanel .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.textbtn { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; text-align: left; transition: background var(--fast) ease; }
.textbtn:hover { background: var(--hover); }
.textbtn .ic { width: 17px; height: 17px; color: var(--muted); }

/* View menu, context menu */
.menu {
  position: fixed; z-index: 40; min-width: 190px; padding: 5px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
  transform-origin: top left; animation: menu-in 140ms var(--ease-out);
}
.menu[hidden] { display: none; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; text-align: left; }
.menu button:hover, .menu button.active { background: var(--hover); }
.menu button .ic { width: 17px; height: 17px; color: var(--muted); }
.menu button .kbd { margin-left: auto; color: var(--muted); font: 500 11px var(--font-mono); }
.menu button[aria-checked="true"] { color: var(--brass-text); font-weight: 600; }
.menu button[aria-checked="true"] .ic { color: var(--brass-text); }
.menu button.danger { color: var(--danger); }
.menu button.danger .ic { color: var(--danger); }
.menu .menu-sep { height: 1px; background: var(--rule); margin: 4px 6px; }
@keyframes menu-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

/* Legend (bottom left) */
#legend { left: 16px; bottom: 16px; min-width: 190px; max-width: 280px; max-height: 42vh; padding: 12px 10px 10px; display: flex; flex-direction: column; }
#legend.collapsed { transform: translateY(12px); }
#legend-collapse { position: absolute; top: -14px; left: 50%; margin-left: -14px; }
#legend-open { left: 16px; bottom: 16px; }
#legend .eyebrow { padding: 0 6px 6px; }
#legend ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
#legend li { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 7px; transition: background var(--fast) ease; }
#legend li:hover { background: var(--hover); }
.swatch { width: 16px; height: 16px; border-radius: 4px; flex: none; border: 1px solid var(--tile-stroke); }
.swatch.unassigned, .hatch { background: repeating-linear-gradient(135deg, var(--unassigned) 0 3px, color-mix(in srgb, var(--unassigned) 70%, #fff) 3px 5px); }
button.swatch { cursor: pointer; }
#legend .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#legend .count { color: var(--muted); font: 500 11px var(--font-mono); }
#legend input.name { border: 1px solid var(--rule); background: var(--bg); border-radius: 5px; padding: 1px 5px; }
#legend .rm { opacity: 0; color: var(--muted); border-radius: 5px; width: 22px; height: 22px; display: grid; place-items: center; }
#legend li:hover .rm { opacity: 1; }
#legend .rm:hover { color: var(--danger); background: var(--hover); }
#legend .eye { opacity: 0; color: var(--muted); border-radius: 5px; width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
#legend li:hover .eye, #legend .eye:focus-visible, #legend li.hidden-dept .eye, #legend li.hidden-flows .eye { opacity: 1; }
#legend .eye:hover { color: var(--ink); background: var(--hover); }
#legend.not-graph .eye { opacity: 0 !important; }
#legend.not-graph li:hover .eye, #legend.not-graph li.hidden-dept .eye, #legend.not-graph li.hidden-flows .eye, #legend.not-graph .eye:focus-visible { opacity: .45 !important; }
body:not(.editing) #legend li[data-dept], #legend li.flows-row { cursor: pointer; }
#legend li.sep { height: 1px; padding: 0; margin: 5px 6px; background: var(--rule); border-radius: 0; }
#legend li.sep:hover { background: var(--rule); }
#legend .flow-key { width: 16px; height: 16px; flex: none; }
#legend .flow-key line { stroke: var(--ink); stroke-width: 2; }
#legend .flow-key path { fill: var(--ink); }
#legend li.hidden-flows .name, #legend li.hidden-flows .count { color: var(--muted); }
#legend li.hidden-flows .flow-key { opacity: .45; }
#legend li.hidden-dept .name, #legend li.hidden-dept .count { color: var(--muted); }
#legend li.hidden-dept .swatch { width: 10px; height: 10px; margin: 3px; border-radius: 50%; }
#legend .add { margin-top: 4px; color: var(--muted); }
#legend .empty-note { color: var(--muted); padding: 2px 6px 4px; font-size: 13px; }
.palette { display: grid; grid-template-columns: repeat(5, 22px); gap: 6px; padding: 8px; }
.palette button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--tile-stroke); }
.palette button[aria-checked="true"] { outline: 2px solid var(--brass); outline-offset: 2px; }

/* Detail panel (right) */
#detail { top: 16px; right: 16px; bottom: 16px; width: 372px; display: flex; flex-direction: column; }
#detail.collapsed { transform: translateX(16px); }
#detail-collapse { position: absolute; left: -18px; top: 50%; margin-top: -18px; }
#detail-open { right: 16px; top: 50%; margin-top: -18px; }
#detail .head { padding: 16px 18px 14px; border-bottom: 1px solid var(--rule); display: flex; gap: 14px; align-items: flex-start; }
#detail .head .col { min-width: 0; }
#detail .head .col.main { flex: 1; }
#detail .head .eyebrow { margin-bottom: 6px; }
#detail .name { font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -.005em; overflow-wrap: anywhere; }
#detail input.name { width: 100%; border: 1px solid transparent; border-radius: 7px; padding: 2px 6px; margin-left: -7px; background: transparent; }
#detail input.name:hover { border-color: var(--rule); }
#detail input.name:focus { border-color: var(--brass); background: var(--bg); outline: none; }
#detail .body { flex: 1; overflow-y: auto; padding: 14px 18px 20px; scrollbar-gutter: stable; }
#detail .placeholder { color: var(--muted); padding: 24px 18px; }
#detail .placeholder p { margin: 0 0 8px; }
#detail section { margin-bottom: 18px; }
#detail section > .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
#detail section > .sec-head .ic { color: var(--ink); width: 19px; height: 19px; }
#detail .desc { white-space: pre-wrap; overflow-wrap: anywhere; }
#detail .desc.empty { color: var(--muted); }
#detail textarea.desc { width: 100%; min-height: 64px; resize: vertical; border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 7px 9px; background: transparent; line-height: 1.45; }
#detail textarea.desc:focus { border-style: solid; border-color: var(--brass); background: var(--bg); outline: none; }
#detail .none { color: var(--muted); font-size: 13px; padding: 2px 0 4px; }
#detail .cadence { display: flex; align-items: center; gap: 10px; }
#detail .cadence .val { font: 500 13px var(--font-mono); }
#detail select { border: 1px solid var(--rule-strong); border-radius: 7px; padding: 4px 8px; background: var(--surface); }
#detail .foot { padding-top: 6px; border-top: 1px solid var(--rule); margin-top: 8px; }
#detail .delete { color: var(--danger); display: inline-flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; margin-top: 8px; }
#detail .delete:hover { background: var(--hover); }

.row { position: relative; display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.row + .note, .row + .note-input { margin: 0 0 6px 0; }
.row .go {
  position: absolute; left: -17px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--bg); opacity: 0; transform: translateX(4px); pointer-events: none;
  transition: opacity var(--fast) ease, transform var(--fast) var(--ease-out);
}
.row .go .ic { width: 14px; height: 14px; stroke-width: 2.5; }
.row:hover .go { opacity: 1; transform: none; }
.tile {
  display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 5px 12px; border-radius: 8px;
  max-width: 210px; min-width: 0; flex: 0 1 auto; text-align: left; line-height: 1.25; font-weight: 500; font-size: 13.5px;
  transition: transform var(--fast) var(--ease-out), box-shadow var(--fast) ease;
}
.tile:hover { box-shadow: 0 0 0 2px var(--brass); }
.tile:active { transform: scale(.98); }
.tile.role { color: var(--on-tile); border: 1px solid var(--tile-stroke); font-weight: 600; }
.tile.process { background: var(--surface); border: 1.5px solid var(--ink); }
.tile.meeting, .tile.document { background: var(--surface); border: 1px solid var(--rule-strong); }
.tile .ic { width: 16px; height: 16px; color: var(--muted); }
.tile.dept { cursor: default; }
.tile.dept:hover { box-shadow: none; }
button.tile.dept { cursor: pointer; }
button.tile.dept:hover { box-shadow: 0 0 0 2px var(--brass); }
.tags { display: flex; gap: 5px; flex-wrap: nowrap; align-items: center; margin-left: auto; flex: none; }
.raci {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font: 500 12px var(--font-mono); background: var(--ink); color: var(--surface); position: relative;
}
.raci.has-note::after { content: ""; position: absolute; top: -1px; right: -1px; width: 7px; height: 7px; border-radius: 50%; background: var(--info); box-shadow: 0 0 0 1.5px var(--surface); }
button.raci { background: transparent; color: var(--muted); border: 1px solid var(--rule-strong); transition: background var(--fast) ease, color var(--fast) ease; }
button.raci:hover { color: var(--ink); border-color: var(--ink); }
button.raci[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag {
  font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px; background: var(--ink); color: var(--surface); border: 1px solid var(--ink);
}
.tag.outline { background: transparent; color: var(--ink); }
button.tag { background: transparent; color: var(--muted); border-color: var(--rule-strong); transition: background var(--fast) ease, color var(--fast) ease; }
button.tag:hover { color: var(--ink); border-color: var(--ink); }
button.tag[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
button.tag:disabled { cursor: default; }
.rm-link { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: none; }
.rm-link:hover { color: var(--danger); background: var(--hover); }
.note { color: var(--muted); font-size: 12.5px; padding-left: 12px; }
.note-input { width: calc(100% - 12px); margin-left: 12px !important; border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 3px 7px; font-size: 12.5px; background: transparent; color: var(--muted); }
.note-input:focus { border-style: solid; border-color: var(--brass); color: var(--ink); outline: none; background: var(--bg); }
.flow-item { margin-bottom: 4px; }
.carries { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-left: 12px; margin: 2px 0 8px; }
.carries .lbl { color: var(--muted); font-size: 12px; margin-right: 2px; }
.carries .carry { display: inline-flex; align-items: center; gap: 1px; min-width: 0; }
.tile.mini { min-height: 24px; padding: 2px 8px; gap: 5px; font-size: 12px; border-radius: 6px; max-width: 200px; }
.tile.mini .ic { width: 13px; height: 13px; }
.carries .rm-link { width: 20px; height: 20px; }
.carries .carry-add { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; min-height: 24px; border-radius: 6px; border: 1px dashed var(--rule-strong); color: var(--muted); font-size: 12px; }
.carries .carry-add:hover { color: var(--ink); border-color: var(--ink); }
.carries .carry-add .ic { width: 13px; height: 13px; }
.rm-link.rev:disabled { opacity: .35; cursor: default; background: none; color: var(--muted); }

/* Search-to-find */
.finder { position: relative; margin-top: 6px; }
.finder input { width: 100%; border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 6px 10px 6px 32px; background: transparent; }
.finder input:focus { border-style: solid; border-color: var(--brass); background: var(--bg); outline: none; }
.finder > .ic { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--muted); }
.finder .results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; max-height: 240px; overflow-y: auto; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); }
.finder .results[hidden] { display: none; }
.finder .results button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
.finder .results button.active { background: var(--hover); }
.finder .results .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.finder .results .lbl { min-width: 0; flex: 1; }
.finder .results .lbl .sub { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.finder .results .create { color: var(--brass-text); font-weight: 600; }
.finder .results .empty { color: var(--muted); padding: 6px 8px; font-size: 13px; }

/* Search bar (top) */
#search {
  position: fixed; z-index: 20; top: 14px; left: 50%; width: min(460px, 44vw); margin-left: calc(min(460px, 44vw) / -2);
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; box-shadow: var(--shadow);
  transform: translateY(-72px); opacity: 0;
  transition: transform var(--panel-t) var(--ease-out), opacity var(--panel-t) ease, top var(--panel-t) var(--ease-out);
}
body.editing #search { top: 34px; }
#search.show { transform: none; opacity: 1; }
/* In focus mode the search drops in beneath the focus bar, so the bar never moves under the pointer. */
body.focusing #search { top: 64px; z-index: 17; transform: translateY(-10px); }
body.focusing #search:not(.show) { pointer-events: none; }
body.editing.focusing #search { top: 84px; }
body.focusing #search.show { transform: none; }
#search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
#search .count { color: var(--muted); font: 500 11.5px var(--font-mono); white-space: nowrap; }
#search .ic { color: var(--muted); }
#search .clear { color: var(--muted); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
#search .clear:hover { background: var(--hover); color: var(--ink); }

/* Edit mode banner */
#edit-banner { position: fixed; z-index: 19; top: 0; left: 0; right: 0; height: 3px; background: var(--brass); pointer-events: none; transform: scaleY(0); transform-origin: top; transition: transform var(--panel-t) var(--ease-out); }
#edit-banner span {
  position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
  padding: 3px 12px 4px; border-radius: 0 0 7px 7px; background: var(--brass); color: #1B2430;
  font: 500 11px var(--font-mono); letter-spacing: .16em; text-transform: uppercase;
}
body.editing #edit-banner { transform: none; }
body:not(.editing) #edit-banner span { display: none; }

/* Zoom controls (bottom middle) */
#zoomctl {
  position: fixed; z-index: 12; bottom: 18px; left: 50%; transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
  display: flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow);
  transition: transform var(--panel-t) var(--ease-out), opacity var(--panel-t) ease;
}
#zoomctl.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
#zoomctl .iconbtn { width: 34px; height: 34px; }

/* Empty state */
#empty { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
#empty[hidden] { display: none; }
#empty .card-e { pointer-events: auto; text-align: center; max-width: 420px; padding: 34px 36px 30px; }
#empty .mark { width: 76px; height: 76px; margin: 0 auto 14px; color: var(--ink); }
#empty .mark .planet { fill: var(--brass); stroke: none; }
#empty h1 { font: italic 400 44px/1 var(--font-eyebrow); margin: 0 0 10px; letter-spacing: -.01em; }
#empty p { color: var(--muted); margin: 0 0 20px; }
#empty .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
#empty .hint { color: var(--muted); font-size: 15px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; font-weight: 600; border: 1px solid var(--rule-strong); background: var(--surface); transition: background var(--fast) ease, transform var(--fast) var(--ease-out); }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--brass-text); border-color: var(--brass-text); }
.btn .ic { width: 17px; height: 17px; }

/* Toast, tooltip, drop overlay */
#toast { position: fixed; z-index: 50; left: 50%; bottom: 72px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; max-width: min(560px, 80vw);
  padding: 9px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-weight: 500;
  transition: transform var(--panel-t) var(--ease-out), opacity var(--panel-t) ease; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
#toast.error { background: var(--danger); color: #fff; }
#tooltip { position: fixed; z-index: 60; max-width: 240px; padding: 7px 10px; border-radius: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-strong); box-shadow: var(--shadow); font-size: 12.5px; white-space: pre-line; pointer-events: none; opacity: 0; transition: opacity 120ms ease; }
#tooltip.show { opacity: 1; }
#drop { position: fixed; inset: 10px; z-index: 70; border: 2px dashed var(--brass); border-radius: 18px; background: var(--brass-wash); display: grid; place-items: center; font: italic 28px var(--font-eyebrow); pointer-events: none; }
#drop[hidden] { display: none; }

/* Warning marks */
.ic.warn-ic { width: 17px; height: 17px; stroke: none; }
.warn { display: inline-grid; place-items: center; flex: none; cursor: help; }
.card .warn { cursor: help; }
body.hide-warn .warn { display: none; }
.sec-head .sec-action { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); border: 1px solid var(--rule-strong); transition: background var(--fast) ease, color var(--fast) ease; }
.sec-head .sec-action:hover:enabled { color: var(--ink); border-color: var(--ink); background: var(--hover); }
.sec-head .sec-action:disabled { opacity: .5; cursor: default; }
.sec-head .sec-action .ic { width: 14px; height: 14px; color: currentColor; }
#detail .head .eyebrow .warn { vertical-align: -2px; margin-left: 6px; }
.menu button:disabled { color: var(--rule-strong); cursor: default; background: none; }
.menu button:disabled .ic { color: var(--rule-strong); }
#subpanel .textbtn .count { margin-left: auto; font: 500 11px var(--font-mono); color: var(--muted); }
#subpanel .textbtn[aria-pressed="false"] .ic { opacity: .45; }

/* Warnings list (centred dialog) */
#warnings {
  width: min(580px, 92vw); max-height: 72vh; padding: 0; display: none; flex-direction: column;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow);
}
#warnings[open] { display: flex; animation: menu-in 160ms var(--ease-out); }
#warnings::backdrop { background: rgba(18, 22, 28, .32); }
#warnings .w-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
#warnings .w-head h2 { margin: 0; font: italic 400 26px/1.1 var(--font-eyebrow); }
#warnings .w-head .count { color: var(--muted); font: 500 12px var(--font-mono); }
#warnings .w-head .close { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
#warnings .w-head .close:hover { background: var(--hover); color: var(--ink); }
#warnings .w-body { overflow-y: auto; padding: 8px 18px 18px; }
#warnings .w-group { margin-top: 12px; }
#warnings .w-group > .eyebrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
#warnings .w-group > .eyebrow .count { font: 500 11px var(--font-mono); font-style: normal; color: var(--muted); }
#warnings .w-item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 0; border-top: 1px solid var(--rule); }
#warnings .w-item:first-of-type { border-top: 0; }
#warnings .w-item .joiner { color: var(--muted); font-size: 12.5px; }
#warnings .w-item .why { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
#warnings .w-empty { color: var(--muted); padding: 18px 0 6px; }

/* Focus bar (top middle, graph focus mode) */
#focusbar {
  position: fixed; z-index: 18; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 5px 6px 5px 14px; max-width: min(560px, 60vw);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; box-shadow: var(--shadow);
  transition: top var(--panel-t) var(--ease-out), opacity var(--panel-t) ease;
}
#focusbar[hidden] { display: none; }
body.editing #focusbar { top: 34px; }
#focusbar .eyebrow { font-size: 16px; }
#focusbar .fname { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#focusbar button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px; white-space: nowrap; transition: background var(--fast) ease, transform var(--fast) var(--ease-out); }
#focusbar button:hover { background: var(--brass-text); }
#focusbar button:active { transform: scale(.97); }
#focusbar button .ic { width: 15px; height: 15px; stroke-width: 2.25; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}

/* ═══════════════════════════ Small helpers ═══════════════════════════ */
const $ = (s, root = document) => root.querySelector(s);

/** Build a DOM element: h('div', {class:'x', onclick}, child, 'text', [more]) */

    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'value') el.value = v;

/* ═══════════════════════════ Store ═══════════════════════════ */
const S = {

/** Make any parsed JSON into a valid model. Returns { data, dropped }. Unknown fields are kept. */
function normalise(input) {
  let dropped = 0;

  const d = { ...src, orrery: FORMAT, title: str(src.title).trim() || 'Untitled organisation' };

  const usedColours = new Set();
  d.departments = list(src.departments).map(x => {
    const colour = /^#[0-9a-f]{6}$/i.test(str(x.colour)) ? x.colour.toUpperCase() : null;
    if (colour) usedColours.add(colour);

  for (const dep of d.departments) if (!dep.colour) { dep.colour = nextColour(d.departments.map(x => x.colour)); }

  d.roles = list(src.roles).map(x => {

const UNDO_LIMIT = 100;

function rectCollide(pad) {
  let nodes = [];
  function force() {
    const n = nodes.length;
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < n; j++) {
        const b = nodes[j];
        const dx = (b.x + b.vx) - (a.x + a.vx), dy = (b.y + b.vy) - (a.y + a.vy);
        const ox = (a.w + b.w) / 2 + pad - Math.abs(dx);
        if (ox <= 0) continue;

        if (oy <= 0) continue;
        const aFixed = a.fx != null, bFixed = b.fx != null;
        const wa = aFixed ? 0 : bFixed ? 1 : 0.5, wb = bFixed ? 0 : aFixed ? 1 : 0.5;
        if (ox < oy) {               // push apart along the axis of least overlap
          const s = (dx < 0 ? -1 : dx > 0 ? 1 : (jitter(a.id) < 0 ? -1 : 1)) * ox * 0.6;
          a.vx -= s * wa; b.vx += s * wb;
        } else {
          const s = (dy < 0 ? -1 : dy > 0 ? 1 : (jitter(b.id) < 0 ? -1 : 1)) * oy * 0.6;

      for (const p of n.peers) { cx += p.x; cy += p.y; }
      cx /= n.peers.length; cy /= n.peers.length;
      n.vx += (cx - n.x) * strength * alpha;
      n.vy += (cy - n.y) * strength * alpha;
    }
  }

  return force;
}

    .filter(l => l.source.id === id || l.target.id === id)
    .map(l => ({ source: byId.get(l.source.id), target: byId.get(l.target.id) }))

const CW = 196, CGAP = 26, RGAP = 7;

  const d = S.data;
  let cols = [];
  let top = 0;
  if (view === 'process') cols = d.processes.map(p => ({ type: 'process', item: p }));
  if (view === 'meeting') cols = d.meetings.map(m => ({ type: 'meeting', item: m }));
  if (view === 'role') {

    let i = 0;
    for (const g of groups) {

      headers.push({ key: 'dep:' + g.dep.id, x: x0, y: 0, w: x1 - x0, h: 30, fill: g.dep.colour, label: g.dep.id === '__none' ? 'Unassigned' : (g.dep.name || 'Untitled department') });

    }

  }

  }

      }

      if (p.documents.length) gap();

    .attr('class', c => `card t-${c.type} k-${c.kind}` + (c.collapsed ? ' collapsed' : '') + (c.flow ? ' flow-row' : ''))
    .attr('data-kind', c => c.kind)

  const es = gEdges.selectAll('line').data(links, l => l.source.id + '>' + l.target.id);
  const eEnter = es.enter().append('line').attr('data-role', l => l.source.id).attr('data-process', l => l.target.id);

  const fs = gFlows.selectAll('g.flow').data(flinks, l => l.flow.id);
  const fEnter = fs.enter().append('g')
    .on('mouseenter', onFlowEnter)
    .on('mouseleave', onFlowLeave);

  fEnter.append('path').attr('class', 'head');
  fEnter.append('line').attr('class', 'hit');
  const fAll = fEnter.merge(fs)
    .attr('class', l => 'flow' + (l.two ? ' two' : '') + (l.flow.id === S.hoverFlow ? ' hover' : ''))

  } else { fAll.style('opacity', 1); fs.exit().remove(); }
  fAll.each(function (l) { placeFlow(this, l); });

  const hEnter = hs.enter().append('g').attr('class', 'hdr');
  hEnter.merge(hs).each(function (hd) {
    const g = d3.select(this);
    g.selectAll('*').remove();

    g.append('rect').attr('x', hd.x).attr('y', hd.y).attr('width', hd.w).attr('height', hd.h).attr('fill', hd.fill || 'url(#hatch)');

    hs.exit().transition(T).duration(dur(160)).style('opacity', 0).remove();
  } else { hEnter.merge(hs).style('opacity', 1); hs.exit().remove(); }

  gOrbits.classed('off', view !== 'graph');

/* ═══════════════════════════ Highlighting ═══════════════════════════ */

  for (const r of S.data.roles) if (hit(r) || (deptOf(r)?.name || '').toLowerCase().includes(q)) m.add(r.id);
  for (const p of S.data.processes) if (hit(p)) m.add(p.id);
  for (const x of [...S.data.meetings, ...S.data.documents]) if (hit(x)) {

/* ═══════════════════════════ Pan, zoom, fit ═══════════════════════════ */
function viewportBox(forTable) {
  const W = window.innerWidth, H = window.innerHeight;

  const right = W - (detailOpen ? 372 + 40 : 28);

}

  const boxes = currentCards.map(c => ({ x0: c.x - c.w / 2, y0: c.y - c.h / 2, x1: c.x + c.w / 2, y1: c.y + c.h / 2 }));
  for (const hd of currentHeaders) if (!hd.note) boxes.push({ x0: hd.x, y0: hd.y, x1: hd.x + hd.w, y1: hd.y + hd.h });

  const table = S.view !== 'graph';
  const vp = viewportBox(table);

  let k, tx, ty;

    k = 1;
    const note = currentHeaders.find(hd => hd.note);
    tx = vp.x + vp.w / 2; ty = vp.y + vp.h / 2;
    if (note) { tx = vp.x + vp.w / 2 - textW(note.label, 'italic 24px "Instrument Serif"') / 2; }
  } else if (!table) {
    k = clamp(Math.min(vp.w / (b.w + 60), vp.h / (b.h + 60)), 0.15, 1.3);
    tx = vp.x + vp.w / 2 - k * (b.x0 + b.w / 2);
    ty = vp.y + vp.h / 2 - k * (b.y0 + b.h / 2);

/* ═══════════════════════════ Refresh cycle ═══════════════════════════ */

  const before = sizeSig();
  const changed = syncSim();
  const resized = before !== sizeSig();
  if (S.view === 'graph' && !S.focus) { if (changed) sim.alpha(0.35).restart(); else if (resized) sim.alpha(reheat).restart(); }

/* ═══════════════════════════ Selection, views, history ═══════════════════════════ */

/* ═══════════════════════════ Card interactions ═══════════════════════════ */

}
svg.on('mouseleave', () => { if (S.hover) { S.hover = null; applyHighlight(); } });

svg.on('mousemove.hover', (e) => {

});
svg.on('click', (e) => {

let dragMoved = false;
const dragBehaviour = d3.drag()

    dragMoved = false;
    c.node.__wasPinned = c.node.fx != null;
    c.node.fx = c.node.x; c.node.fy = c.node.y;
    sim.alphaTarget(0.12).restart();
  })
  .on('drag', (e, c) => {

    } else if (!n.__wasPinned) { n.fx = null; n.fy = null; }

  if (hadPins) setDirty(true);

/* ═══════════════════════════ Keyboard ═══════════════════════════ */
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (warnDlg.open) return;           // the dialog handles its own keys (Esc closes it)
  if (mod && k === 's') { e.preventDefault(); if (typing) typing.blur(); e.shiftKey ? saveAs() : save(); return; }
  if (mod && k === 'o') { e.preventDefault(); openFile(); return; }
  if (mod && k === 'f') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') {
    if (!menuEl.hidden) { hideMenu(); return; }
    if (typing) { typing.blur(); return; }
    if (S.search) { setSearch(''); return; }
    if (S.focus) { setFocus(null); return; }
    select(null, { push: false });
    return;
  }
  if (typing) return;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goHist(-1); return; }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goHist(1); return; }
  if (mod || e.altKey) return;
  if (k === 'e') { toggleEdit(); return; }
  if (k === 'f') { fit(); return; }
  if (k === 'w') { openWarnings(); return; }
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  const v = VIEWS.find(x => x.key === e.key);
  if (v) { setView(v.id); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.edit && S.sel && !e.target.closest('#menu')) { e.preventDefault(); deleteEntity(S.sel); }
});

/** Search-to-find. candidates() → [{id,label,colour?,type?}] */
function finder({ key, placeholder, candidates, onPick, onCreate = null, createLabel = null, keepOpen = false }) {
  const input = h('input', { type: 'text', placeholder, 'aria-label': placeholder, autocomplete: 'off', spellcheck: 'false', role: 'combobox', 'aria-expanded': 'false' });
  const list = h('div', { class: 'results', role: 'listbox', hidden: true });
  const wrapEl = h('div', { class: 'finder', 'data-finder': key }, icon('i-search'), input, list);
  let items = [], active = 0;
  const build = () => {
    const q = input.value.trim().toLowerCase();
    const all = candidates();
    const matches = all.filter(c => !q || c.label.toLowerCase().includes(q)).slice(0, 8);
    items = matches.map(c => ({ ...c, run: () => onPick(c.id) }));
    if (onCreate && q && !all.some(c => c.label.toLowerCase() === q)) {
      const name = input.value.trim();
      items.push({ create: true, label: createLabel(name), run: () => onCreate(name) });
    }
    active = clamp(active, 0, Math.max(0, items.length - 1));
    list.replaceChildren(...(items.length ? items.map((it, i) => h('button', {
      class: (it.create ? 'create' : '') + (i === active ? ' active' : ''), role: 'option', tabindex: '-1',
      onmousedown: (e) => e.preventDefault(),
      onclick: () => choose(i),
    }, it.create ? icon('i-plus', 'ic sm') : (it.colour !== undefined ? h('span', { class: 'sw' + (it.colour ? '' : ' hatch'), style: it.colour ? `background:${it.colour}` : null }) : null), h('span', { class: 'lbl' }, it.label, it.sub ? h('span', { class: 'sub' }, it.sub) : null)))
      : [h('div', { class: 'empty' }, q ? 'No matches.' : 'Nothing left to add.')]));
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  };
  const choose = (i) => {
    const it = items[i];
    if (!it) return;
    if (!keepOpen) pendingFinder = key;
    input.value = '';
    list.hidden = true;
    it.run();
  };
  input.addEventListener('focus', () => { active = 0; build(); });
  input.addEventListener('input', () => { active = 0; build(); });
  input.addEventListener('blur', () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items.length - 1); build(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); build(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (input.value) { input.value = ''; build(); } else { input.blur(); hideMenu(); } }
  });
  return wrapEl;
}
const roleCands = (exclude) => S.data.roles.filter(r => !exclude.has(r.id)).sort(byName).map(r => ({ id: r.id, label: displayName(r, 'role'), colour: roleColour(r) }));

function roleSections(role) {

function processSections(p) {

/** "Fed by" (dir 'in') or "Feeds into" (dir 'out'): the process's flows, each with its description and carried documents. */
function flowSection(p, dir) {
  const pid = p.id, incoming = dir === 'in';
  const flows = (incoming ? idx.flowsTo : idx.flowsFrom).get(pid);
  const otherOf = f => (incoming ? f.from : f.to);
  const sec = section(incoming ? 'fed-by' : 'feeds', incoming ? 'i-flow-in' : 'i-flow-out', incoming ? 'Fed by' : 'Feeds into');
  if (!flows.length && !S.edit) sec.append(emptyLine(incoming ? 'Not fed by any process.' : 'Doesn’t feed any process.'));
  for (const f of [...flows].sort((a, b) => byName(itemOf(otherOf(a)), itemOf(otherOf(b))))) sec.append(flowItem(f, incoming));
  if (S.edit) sec.append(finder({
    key: 'proc-flow-' + dir, placeholder: incoming ? 'Add an input from…' : 'Add an output to…',
    candidates: () => plainCands('process', new Set([pid, ...flows.map(otherOf)])),
    onPick: (oid) => commit('add flow', d => addFlow(d, incoming ? oid : pid, incoming ? pid : oid)),
    onCreate: (name) => commit('create process', d => { const x = createItem(d, 'process', { name }); addFlow(d, incoming ? x.id : pid, incoming ? pid : x.id); }),
    createLabel: (n) => `Create process “${n}”`,
  }));

    onclick: () => commit('reverse flow', d => reverseFlow(d, f.id)),
  }, icon('i-swap', 'ic sm')));
  const wrap = h('div', { class: 'flow-item', 'data-flow': f.id },
    linkRow(other, tags, () => commit('remove flow', d => removeFlow(d, f.id)), 'Remove flow', warns.length ? { text: warns.map(w => w.text).join('\n') } : null));
  if (S.edit) wrap.append(h('input', {
    class: 'note-input', value: f.description, 'aria-label': 'What passes along this flow',
    placeholder: incoming ? 'What comes in from this process?' : 'What goes to this process?',

    onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
  }));
  else if (f.description.trim()) wrap.append(h('div', { class: 'note' }, f.description.trim()));
  if (f.documents.length || S.edit) {
    const carries = h('div', { class: 'carries' }, h('span', { class: 'lbl' }, 'Carries'));
    for (const did of f.documents) {
      const doc = itemOf(did), name = displayName(doc, 'document');
      carries.append(h('span', { class: 'carry' },
        h('button', { class: 'tile document mini', onclick: () => select(did), title: `Go to ${name}` }, icon('i-docs'), h('span', null, name)),
        S.edit ? h('button', { class: 'rm-link', title: 'Stop carrying this document', 'aria-label': `Stop carrying ${name}`,
          onclick: () => commit('remove carried document', d => { const x = findFlow(d, f.id); x.documents = x.documents.filter(v => v !== did); }) }, icon('i-x', 'ic sm')) : null));
    }
    if (S.edit) carries.append(h('button', { class: 'carry-add', title: 'Add a document this flow carries', onclick: (e) => carryPicker(f, e.currentTarget) }, icon('i-plus'), 'Document'));
    wrap.append(carries);
  }
  return wrap;
}
/** Pick a document for a flow to carry. The source process's own documents come first. */
function carryPicker(f, anchor) {
  const srcDocs = itemOf(f.from).documents;
  const srcName = displayName(itemOf(f.from), 'process');
  const el = finder({
    key: 'flow-doc', placeholder: 'Find or create a document',
    candidates: () => {
      const all = plainCands('document', new Set(f.documents));
      return [...all.filter(c => srcDocs.includes(c.id)).map(c => ({ ...c, sub: `In ${srcName}` })), ...all.filter(c => !srcDocs.includes(c.id))];
    },
    onPick: (did) => { hideMenu(); commit('add carried document', d => { findFlow(d, f.id).documents.push(did); }); },
    // A new document also joins the source process, so the flow doesn't start with a warning.
    onCreate: (name) => { hideMenu(); commit('create document', d => { const x = createItem(d, 'document', { name }); findIn(d, 'process', f.from).documents.push(x.id); findFlow(d, f.id).documents.push(x.id); }); },
    createLabel: (n) => `Create document “${n}”`,
    keepOpen: true,
  });
  el.style.cssText = 'margin:0;width:260px;padding:4px';
  const r = anchor.getBoundingClientRect();
  showMenu(null, r.left, r.bottom + 6, { content: el, returnFocus: anchor });
  $('input', el).focus();
}

function partOfSection(x, type) {
  const procs = idx.procsOf.get(x.id) || [];
  const sec = section('processes', 'i-cog', 'Part of');
  if (!procs.length && !S.edit) sec.append(emptyLine('Not part of any process yet.'));
  const listKey = TYPES[type].list;
  for (const p of procs) sec.append(linkRow(p.id, [], () => commit(`remove from process`, d => { const q = findIn(d, 'process', p.id); q[listKey] = q[listKey].filter(v => v !== x.id); }), 'Remove from process'));
  if (S.edit) sec.append(finder({
    key: type + '-proc', placeholder: 'Add to a process…',
    candidates: () => plainCands('process', new Set(procs.map(p => p.id))),
    onPick: (pid) => commit('add to process', d => { findIn(d, 'process', pid)[listKey].push(x.id); }),
  }));
  return sec;
}
function meetingSections(m) {
  const mid = m.id;
  const secC = section('cadence', 'i-calendar', 'Cadence');
  if (S.edit) {
    const sel = h('select', { 'aria-label': 'Cadence', onchange: (e) => commit('set cadence', d => { findIn(d, 'meeting', mid).cadence = e.target.value || null; }) },
      h('option', { value: '' }, 'Not specified'), CADENCES.map(c => h('option', { value: c }, CADENCE_LABEL[c])));
    sel.value = m.cadence || '';
    secC.append(sel);
  } else secC.append(h('div', { class: 'cadence' }, h('span', { class: m.cadence ? 'val' : 'none' }, m.cadence ? CADENCE_LABEL[m.cadence] : 'Not specified')));
  const secR = section('roles', 'i-person', 'Roles');
  if (S.edit) $('.sec-head', secR).append(processRolesButton(m));
  if (!m.roles.length && !S.edit) secR.append(emptyLine('No roles yet.'));
  for (const r of rolesSorted(m.roles.map(l => l.role))) {
    const link = m.roles.find(l => l.role === r.id);
    secR.append(linkRow(r.id, meetingTags(mid, r.id, link), () => commit('remove role', d => { const x = findIn(d, 'meeting', mid); x.roles = x.roles.filter(l => l.role !== r.id); }), 'Remove role', warnPair(mid, r.id)));
  }
  if (S.edit) secR.append(finder({
    key: 'mtg-role', placeholder: 'Add a role…',
    candidates: () => roleCands(new Set(m.roles.map(l => l.role))),
    onPick: (rid) => commit('add role', d => { findIn(d, 'meeting', mid).roles.push({ role: rid, chair: false, mandatory: false }); }),
    onCreate: (name) => commit('create role', d => { const r = createItem(d, 'role', { name }); findIn(d, 'meeting', mid).roles.push({ role: r.id, chair: false, mandatory: false }); }),
    createLabel: (n) => `Create role “${n}”`,
  }));
  return [secC, secR, partOfSection(m, 'meeting')];
}
/** "Add process roles": copy the roles of the meeting's process(es) into the meeting in one step. */
function processRolesButton(m) {
  const mid = m.id;
  const procs = idx.procsOf.get(mid) || [];
  const have = new Set(m.roles.map(l => l.role));
  const missing = (ps) => rolesSorted([...new Set(ps.flatMap(p => p.roles.map(l => l.role)))]).map(r => r.id).filter(r => !have.has(r));
  const add = (ps) => {
    const ids = missing(ps);
    if (!ids.length) return;
    const from = ps.length === 1 ? displayName(ps[0], 'process') : `${ps.length} processes`;
    if (commit('add process roles', d => { findIn(d, 'meeting', mid).roles.push(...ids.map(role => ({ role, chair: false, mandatory: false }))); }))
      toast(`Added ${ids.length} role${ids.length === 1 ? '' : 's'} from ${from}.`);
  };
  const all = missing(procs);
  const multi = procs.length > 1;
  const title = !procs.length ? 'Add this meeting to a process first'
    : !all.length ? 'All process roles are already in this meeting'
    : multi ? 'Add the roles of one or all of this meeting’s processes' : `Add the roles of ${displayName(procs[0], 'process')}`;
  return h('button', {
    class: 'sec-action', title, 'aria-label': 'Add process roles', disabled: !procs.length || !all.length, 'aria-haspopup': multi ? 'menu' : null,
    onclick: (e) => {
      if (!multi) return add(procs);
      const b = e.currentTarget, r = b.getBoundingClientRect();
      const n = ps => missing(ps).length;
      showMenu([
        { label: `All processes (${all.length} new)`, icon: 'i-plus', run: () => add(procs) },
        '-',
        ...procs.map(p => ({ label: `${displayName(p, 'process')} (${n([p])} new)`, icon: 'i-cog', disabled: !n([p]), run: () => add([p]) })),
      ], r.right - 240, r.bottom + 6, { returnFocus: b });
    },
  }, icon('i-plus'), 'Add process roles', multi ? icon('i-down') : null);
}
function documentSections(doc) {
  const did = doc.id;
  const people = (key, title, listKey, other, emptyText) => {
    const sec = section(key, 'i-person', title);
    if (!doc[listKey].length && !S.edit) sec.append(emptyLine(emptyText));
    for (const r of rolesSorted(doc[listKey])) sec.append(linkRow(r.id, [], () => commit(`remove ${key === 'owners' ? 'owner' : 'reviewer'}`, d => { const x = findIn(d, 'document', did); x[listKey] = x[listKey].filter(v => v !== r.id); }), `Remove ${key === 'owners' ? 'owner' : 'reviewer'}`, key === 'owners' ? warnPair(did, r.id) : null));
    if (S.edit) sec.append(finder({
      key: 'doc-' + key, placeholder: key === 'owners' ? 'Add an owner…' : 'Add a reviewer…',
      candidates: () => roleCands(new Set(doc[listKey])),
      onPick: (rid) => commit(`add ${key === 'owners' ? 'owner' : 'reviewer'}`, d => { const x = findIn(d, 'document', did); x[other] = x[other].filter(v => v !== rid); x[listKey].push(rid); }),
      onCreate: (name) => commit('create role', d => { const r = createItem(d, 'role', { name }); findIn(d, 'document', did)[listKey].push(r.id); }),
      createLabel: (n) => `Create role “${n}”`,
    }));
    return sec;
  };
  return [people('owners', 'Owned by', 'owners', 'reviewers', 'No owner yet.'), people('reviewers', 'Reviewers', 'reviewers', 'owners', 'No reviewers yet.'), partOfSection(doc, 'document')];
}

/* ── Tooltip (RACI notes etc.) ── */
const tipEl = $('#tooltip');
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { if (!(e.target.closest && e.target.closest('#stage g.flow'))) tipEl.classList.remove('show'); return; }   // flows place their own tip
  tipEl.textContent = t.dataset.tip;
  const r = t.getBoundingClientRect();
  tipEl.classList.add('show');
  const tr = tipEl.getBoundingClientRect();
  tipEl.style.left = clamp(r.left + r.width / 2 - tr.width / 2, 8, window.innerWidth - tr.width - 8) + 'px';
  tipEl.style.top = (r.top - tr.height - 8 < 8 ? r.bottom + 8 : r.top - tr.height - 8) + 'px';
});
/** A tooltip above a point on screen (a flow's arrow: a long diagonal line's bounding box would place it badly). */
function showTipAt(x, y, text) {
  tipEl.textContent = text;
  tipEl.classList.add('show');
  const tr = tipEl.getBoundingClientRect();
  tipEl.style.left = clamp(x - tr.width / 2, 8, window.innerWidth - tr.width - 8) + 'px';
  tipEl.style.top = (y - tr.height - 14 < 8 ? y + 14 : y - tr.height - 14) + 'px';
}

/* ═══════════════════════════ Warnings list ═══════════════════════════ */
const warnDlg = $('#warnings');
function renderWarnings() {
  const list = idx.warn.list;
  $('.w-head .count', warnDlg).textContent = list.length ? `${list.length} to check` : '';
  const body = $('.w-body', warnDlg);
  const go = (id) => { warnDlg.close(); select(id); setCollapsed('detail', false); };
  const tile = (id) => {
    const t = typeOf(id), x = itemOf(id);
    const attrs = { class: `tile ${t}`, onclick: () => go(id), title: `Go to ${displayName(x, t)}` };
    if (t === 'role') { const c = roleColour(x); attrs.style = c ? `background:${c}` : null; if (!c) attrs.class += ' hatch'; }
    return h('button', attrs, t !== 'role' ? icon(TYPES[t].icon) : null, h('span', null, displayName(x, t)));
  };
  if (!list.length) { body.replaceChildren(h('p', { class: 'w-empty' }, 'No warnings. Everything lines up.')); return; }
  const groups = Object.keys(WARN_RULES).map(rule => ({ rule, items: list.filter(w => w.rule === rule) })).filter(g => g.items.length);
  body.replaceChildren(...groups.map(g => h('section', { class: 'w-group', 'data-rule': g.rule },
    h('div', { class: 'eyebrow' }, WARN_RULES[g.rule], h('span', { class: 'mono count' }, `· ${g.items.length}`)),
    ...g.items.map(w => h('div', { class: 'w-item' },
      w.to ? [tile(w.target), h('span', { class: 'joiner' }, w.twoWay ? '⇄' : '→'), tile(w.to), ...(w.doc ? [h('span', { class: 'joiner' }, 'carries'), tile(w.doc)] : [])]
      : w.other ? [tile(w.other), h('span', { class: 'joiner' }, w.rule === 'doc-owner-outside' ? 'owns' : 'in'), tile(w.target)] : tile(w.target),
      h('div', { class: 'why' }, w.text))))));
}
function openWarnings() {
  hideMenu();
  renderWarnings();
  if (!warnDlg.open) warnDlg.showModal();
  $('.w-head .close', warnDlg).focus();
}
$('.w-head .close', warnDlg).addEventListener('click', () => warnDlg.close());
warnDlg.addEventListener('click', (e) => { if (e.target === warnDlg) warnDlg.close(); });   // click on the backdrop

/* ═══════════════════════════ Toast ═══════════════════════════ */
let toastTimer = null;
function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('error', kind === 'error');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), kind === 'error' ? 6000 : 2800);
}

/* ═══════════════════════════ Files ═══════════════════════════ */
const FILE_TYPES = [{ description: 'Orrery organisation (JSON)', accept: { 'application/json': ['.json'] } }];
function confirmDiscard() {
  return !S.dirty || window.confirm('You have unsaved changes. Discard them?');
}
function loadData(json, meta = {}) {
  const { data, dropped } = normalise(json);
  S.data = data;
  S.fileHandle = meta.handle || null;
  S.fileName = meta.name || null;
  S.undo = []; S.redo = [];
  S.sel = null; S.hover = null; S.hoverKey = null; S.legendHover = null; S.focus = null; S.hiddenDepts = new Set();
  S.hideFlows = false; S.hoverFlow = null;
  setSearch('');
  simNodes.clear(); structureSig = ''; lastPos = new Map(); simStale = false;
  gCards.selectAll('g.card').remove();
  idx = buildIndex(S.data);
  syncSim();
  settle();
  S.hist = [{ view: S.view, sel: null, focus: null }]; S.histIdx = 0;
  S.dirty = false;
  refresh();
  fit({ animate: false });
  return dropped;
}
function loadText(text, name, handle) {
  let json;
  try { json = JSON.parse(text); }
  catch (err) {
    const m = /line (\d+)/.exec(err.message) || null;
    let line = m ? +m[1] : null;
    const pos = /position (\d+)/.exec(err.message);
    if (!line && pos) line = text.slice(0, +pos[1]).split('\n').length;
    // Newer engines quote ~10 characters either side of the error instead of giving a position.
    const ctx = /, (\.\.\.)?"([\s\S]+)"(?:\.\.\.)? is not valid JSON$/.exec(err.message);
    if (!line && ctx && text.indexOf(ctx[2]) >= 0) line = text.slice(0, text.indexOf(ctx[2]) + (ctx[1] ? 10 : 0)).split('\n').length;
    if (!line && /end of JSON/i.test(err.message)) line = text.split('\n').length;
    toast(`${name} isn’t valid JSON${line ? ` (line ${line})` : ''}. Nothing was changed.`, 'error');
    return false;
  }
  if (!isObj(json)) { toast(`${name} doesn’t contain an organisation. Nothing was changed.`, 'error'); return false; }
  const dropped = loadData(json, { name, handle });
  toast(dropped ? `Opened ${name}. Removed ${dropped} link${dropped === 1 ? '' : 's'} to items that don’t exist.` : `Opened ${name}.`);
  return true;
}
async function openFile() {
  if (!confirmDiscard()) return;
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: FILE_TYPES });
      const f = await handle.getFile();
      loadText(await f.text(), f.name, handle);
    } catch (e) { if (e.name !== 'AbortError') toast(`Couldn’t open the file: ${e.message}`, 'error'); }
  } else $('#file-input').click();
}
$('#file-input').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) loadText(await f.text(), f.name, null);
});
function loadExample() {
  if (!confirmDiscard()) return;
  loadData(structuredClone(EXAMPLE), { name: null });
  toast('Loaded the example organisation.');
}
const serialise = () => JSON.stringify(S.data, null, 2) + '\n';
const suggestedName = () => S.fileName || (S.data.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'organisation') + '.json';
async function save() {
  if (document.activeElement && document.activeElement.matches('input, textarea')) document.activeElement.blur();
  if (S.fileHandle && S.fileHandle.createWritable) {
    try {
      const w = await S.fileHandle.createWritable();
      await w.write(serialise()); await w.close();
      setDirty(false);
      toast(`Saved ${S.fileName}.`);
      return;
    } catch (e) {
      if (e.name === 'AbortError' || e.name === 'NotAllowedError') { toast('Not saved: permission to write the file was refused. Try Save as….', 'error'); return; }
    }
  }
  return saveAs();
}
async function saveAs() {
  if (document.activeElement && document.activeElement.matches('input, textarea')) document.activeElement.blur();
  const name = suggestedName();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: name, types: FILE_TYPES });
      const w = await handle.createWritable();
      await w.write(serialise()); await w.close();
      S.fileHandle = handle; S.fileName = handle.name;
      setDirty(false);
      toast(`Saved ${handle.name}.`);
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = h('a', { href: URL.createObjectURL(new Blob([serialise()], { type: 'application/json' })), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  S.fileName = name;
  setDirty(false);
  toast(`Downloaded ${name}.`);
}
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

// Drag a JSON file onto the window to open it.
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
window.addEventListener('drop', async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  const f = e.dataTransfer.files[0];
  if (f && confirmDiscard()) loadText(await f.text(), f.name, null);
});

/* ═══════════════════════════ Start ═══════════════════════════ */
window.addEventListener('resize', () => { hideMenu(); updateReveal(); });
applyPrefs();
S.data = emptyData();
idx = buildIndex(S.data);
S.hist = [{ view: 'graph', sel: null, focus: null }]; S.histIdx = 0;
if (new URLSearchParams(location.search).has('example')) loadData(structuredClone(EXAMPLE));
else { refresh(); fit({ animate: false }); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  mcache.clear();
  const wasEmpty = !S.data.roles.length && !S.data.processes.length;
  refresh();
  if (!wasEmpty && S.view === 'graph') { settle(90); positionGraph(); fit({ animate: false }); }
});

// Hook for automated tests and the console.
window.orrery = {
  load: (json, name = 'test.json') => loadData(json, { name }),
  loadText: (text, name = 'test.json') => loadText(text, name, null),
  loadExample: () => loadData(structuredClone(EXAMPLE)),
  example: () => structuredClone(EXAMPLE),
  normalise: (json) => normalise(json),
  data: () => structuredClone(S.data),
  state: () => ({ view: S.view, sel: S.sel, focus: S.focus, edit: S.edit, hidden: [...S.hiddenDepts], hideFlows: S.hideFlows, dirty: S.dirty, search: S.search, undo: S.undo.length, redo: S.redo.length, histIdx: S.histIdx, hist: S.hist.length, fileName: S.fileName, morphing, simAlpha: sim.alpha() }),
  setView: (v) => setView(v),
  select: (id) => select(id),
  focus: (id) => setFocus(id),
  warnings: () => idx.warn.list.map(w => ({ ...w })),
  edit: (on) => toggleEdit(on),
  undo, redo, fit, resetView, firstSentence,
  settle: () => { sim.stop(); settle(); positionGraph(); },
  serialise,
};
